<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="arGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="arGradSec" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#090D16" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#arGrad)" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Geometric Letter A -->
  <path d="M20 74 L37 26 L54 74" stroke="url(#arGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M27 57 H47" stroke="url(#arGradSec)" stroke-width="5" stroke-linecap="round" />

  <!-- Geometric Letter R -->
  <path d="M54 26 V74" stroke="url(#arGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M54 26 H68 C76.5 26 81 31 81 38.5 C81 46 76.5 51 68 51 H54" stroke="url(#arGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M66 51 L80 74" stroke="url(#arGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent dot -->
  <circle cx="81" cy="26" r="3.5" fill="#22D3EE" filter="url(#glow)" />
</svg>